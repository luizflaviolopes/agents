<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline - Agent Fleet</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { font-size: 18px; margin: 20px 0 8px; }
      p { font-size: 14px; color: #a1a1aa; margin: 0 0 24px; max-width: 32ch; }
      button {
        background: #6366f1;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Agent Fleet needs a connection to reach your projects and agents.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
